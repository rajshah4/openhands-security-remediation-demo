name: Validate

on:
  push:
    branches:
      - main
      - "fix/**"
  pull_request:
    branches:
      - main
      - "demo/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.14"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-groups
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run python scripts/run_sast.py --expect 0
