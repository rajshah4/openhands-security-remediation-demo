[project]
name = "openhands-security-remediation-demo"
version = "0.1.0"
description = "Jira-triggered OpenHands Enterprise SAST remediation demo"
requires-python = ">=3.11"
dependencies = [
  "flask==3.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/security_demo"]


[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.5",
]
security = [
  "semgrep==1.175.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
